<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DJ Console</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dj_console.css') }}">
</head>
<body data-guild-id="{{ guild_id }}">
  <div class="console-aura console-aura-left" aria-hidden="true"></div>
  <div class="console-aura console-aura-right" aria-hidden="true"></div>
  <main class="console-shell">
    <section class="hero-panel">
      <div class="brand-block">
        <p class="eyebrow">Pitonazz Remote Deck</p>
        <h1>DJ Console</h1>
        <div class="console-signal-row">
          <span class="console-chip console-chip-live">Realtime</span>
          <span class="console-chip console-chip-fx">Mixer FX</span>
          <span class="console-chip console-chip-queue">Queue control</span>
        </div>
      </div>
      <div class="status-grid">
        <div class="status-card status-card-voice">
          <span class="status-label">Voice</span>
          <span class="status-flare" aria-hidden="true"></span>
          <div class="status-value-shell">
            <strong id="voice-channel" class="status-value">-</strong>
          </div>
          <span class="status-meta">Current room bus</span>
        </div>
        <div class="status-card status-card-live">
          <span class="status-label">State</span>
          <span class="status-flare" aria-hidden="true"></span>
          <div class="status-value-shell state-shell">
            <div class="state-line">
              <span id="playback-indicator" class="live-dot is-offline"></span>
              <strong id="playback-state" class="state-pill state-offline">Offline</strong>
            </div>
          </div>
          <span class="status-meta">Playback transport</span>
        </div>
        <div class="status-card status-card-effect">
          <span class="status-label">Effect</span>
          <span class="status-flare" aria-hidden="true"></span>
          <div class="status-value-shell">
            <strong id="effect-summary" class="status-value">off</strong>
          </div>
          <span class="status-meta">Live color shaping</span>
        </div>
        <div class="status-card status-card-energy">
          <span class="status-label">Energy</span>
          <span class="status-flare" aria-hidden="true"></span>
          <div class="status-value-shell">
            <strong id="tone-summary" class="status-value">flat</strong>
          </div>
          <span class="status-meta">EQ scene contour</span>
        </div>
      </div>
    </section>

    <section class="deck-grid">
      <article class="deck-panel platter-panel">
        <div class="platter-wrap" id="platter-wrap">
          <div class="platter-shadow"></div>
          <div class="platter-disc" id="platter-disc">
            <div class="platter-ring"></div>
            <div class="groove-layer"></div>
            <div class="platter-center">
              <img id="cover-art" alt="Cover art">
              <div id="cover-fallback">NO ART</div>
              <span class="spindle-core"></span>
            </div>
          </div>
        </div>
        <div class="track-meta">
          <p class="track-kicker">Now Playing</p>
          <h2 id="track-title">Nessuna traccia</h2>
          <p id="track-artist">-</p>
          <p id="track-requester">-</p>
        </div>
        <div class="progress-block">
          <div class="progress-topline">
            <span id="position-label">00:00</span>
            <span id="duration-label">00:00</span>
          </div>
          <div class="progress-track"><div id="progress-fill"></div></div>
        </div>
      </article>

      <article class="deck-panel mixer-panel">
        <div class="controls-header">
          <h3>Mixer</h3>
        </div>
        <div class="mixer-layout">
          <aside class="channel-strip">
            <label for="volume-slider">Volume</label>
            <div class="volume-well fader-slot">
              <input id="volume-slider" class="volume-fader fader-vertical" type="range" min="0" max="1" step="0.01" value="0.5" data-default="0.5">
              <button id="volume-slider-handle" class="fader-handle" type="button" aria-label="Volume fader handle"></button>
            </div>
            <span id="volume-value" class="volume-readout">0%</span>
          </aside>
          <div class="mixer-main">
            <div class="mixer-grid">
              <div class="control-stack">
                <label>Quick FX</label>
                <div class="fx-pad-grid">
                  <button data-filter-preset="off">Clean</button>
                  <button data-filter-preset="nightcore">Rush</button>
                  <button data-filter-preset="vaporwave">Drift</button>
                  <button data-filter-preset="8d">Orbit</button>
                  <button data-filter-preset="bassboost">Punch</button>
                  <button data-filter-preset="radio">Radio</button>
                </div>
              </div>
              <div class="control-stack">
                <label for="filter-select">Filtro</label>
                <div class="filter-select-shell" id="filter-select-shell">
                  <button id="filter-select-trigger" class="filter-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <span class="filter-select-copy">
                      <span class="filter-select-kicker">Live Filter</span>
                      <strong id="filter-select-label">Off</strong>
                    </span>
                    <span class="filter-select-chevron" aria-hidden="true">↓</span>
                  </button>
                  <div id="filter-select-menu" class="filter-select-menu" role="listbox" aria-label="Filtro console">
                    <button type="button" class="filter-option is-selected" data-filter-option="off">Off</button>
                    <button type="button" class="filter-option" data-filter-option="nightcore">Nightcore</button>
                    <button type="button" class="filter-option" data-filter-option="vaporwave">Vaporwave</button>
                    <button type="button" class="filter-option" data-filter-option="8d">8D Audio</button>
                    <button type="button" class="filter-option" data-filter-option="bassboost">Bass Boost</button>
                    <button type="button" class="filter-option" data-filter-option="trebleboost">Treble Boost</button>
                    <button type="button" class="filter-option" data-filter-option="vocalboost">Vocal Boost</button>
                    <button type="button" class="filter-option" data-filter-option="radio">Radio / Phone</button>
                    <button type="button" class="filter-option" data-filter-option="night">Night Mode</button>
                  </div>
                  <select id="filter-select" class="filter-select-native" tabindex="-1" aria-hidden="true">
                    <option value="off">Off</option>
                    <option value="nightcore">Nightcore</option>
                    <option value="vaporwave">Vaporwave</option>
                    <option value="8d">8D Audio</option>
                    <option value="bassboost">Bass Boost</option>
                    <option value="trebleboost">Treble Boost</option>
                    <option value="vocalboost">Vocal Boost</option>
                    <option value="radio">Radio / Phone</option>
                    <option value="night">Night Mode</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="tone-grid">
              <div class="control-stack">
                <label>Tone Scenes</label>
                <div class="fx-pad-grid">
                  <button data-eq-scene="flat">Flat</button>
                  <button data-eq-scene="club">Club</button>
                  <button data-eq-scene="warm">Warm</button>
                  <button data-eq-scene="air">Air</button>
                  <button data-eq-scene="kill-low">Kill Low</button>
                  <button data-eq-scene="kill-high">Kill High</button>
                </div>
              </div>
            </div>
            <div class="control-stack contour-stack">
              <label>Contour</label>
              <div class="knob-bank">
                <div class="knob-unit">
                  <div class="knob-shell">
                    <div id="fx-highpass-knob" class="fx-knob" style="--knob-angle: -135deg;">
                      <span class="knob-marker"></span>
                      <input id="fx-highpass" class="knob-hitbox" type="range" min="0" max="4000" step="10" value="0" data-default="0">
                    </div>
                  </div>
                  <span class="knob-label">High Pass</span>
                  <span id="fx-highpass-value" class="knob-value">off</span>
                </div>
                <div class="knob-unit">
                  <div class="knob-shell">
                    <div id="fx-lowpass-knob" class="fx-knob" style="--knob-angle: 135deg;">
                      <span class="knob-marker"></span>
                      <input id="fx-lowpass" class="knob-hitbox" type="range" min="200" max="20000" step="100" value="20000" data-default="20000">
                    </div>
                  </div>
                  <span class="knob-label">Low Pass</span>
                  <span id="fx-lowpass-value" class="knob-value">off</span>
                </div>
              </div>
            </div>
            <div class="eq-grid">
              <div class="eq-band">
                <label for="eq-low">Low</label>
                <div class="fader-slot eq-slot">
                  <input id="eq-low" class="fader-vertical eq-fader" type="range" min="-12" max="12" step="0.5" value="0" orient="vertical" data-default="0">
                  <button id="eq-low-handle" class="fader-handle" type="button" aria-label="Low EQ fader handle"></button>
                </div>
                <span id="eq-low-value">0 dB</span>
              </div>
              <div class="eq-band">
                <label for="eq-mid">Mid</label>
                <div class="fader-slot eq-slot">
                  <input id="eq-mid" class="fader-vertical eq-fader" type="range" min="-12" max="12" step="0.5" value="0" orient="vertical" data-default="0">
                  <button id="eq-mid-handle" class="fader-handle" type="button" aria-label="Mid EQ fader handle"></button>
                </div>
                <span id="eq-mid-value">0 dB</span>
              </div>
              <div class="eq-band">
                <label for="eq-high">High</label>
                <div class="fader-slot eq-slot">
                  <input id="eq-high" class="fader-vertical eq-fader" type="range" min="-12" max="12" step="0.5" value="0" orient="vertical" data-default="0">
                  <button id="eq-high-handle" class="fader-handle" type="button" aria-label="High EQ fader handle"></button>
                </div>
                <span id="eq-high-value">0 dB</span>
              </div>
            </div>
          </div>
        </div>
      </article>

      <article class="deck-panel queue-panel">
        <div class="controls-header">
          <h3>Queue</h3>
        </div>
        <ol id="queue-list" class="queue-list"></ol>
      </article>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/dj_console.js') }}" defer></script>
</body>
</html>
