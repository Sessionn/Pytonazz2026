<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DJ Console Error</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dj_console.css') }}">
</head>
<body class="error-body">
  <main class="error-card">
    <p class="eyebrow">Pitonazz Remote Deck</p>
    <h1>Accesso console negato</h1>
    <p class="error-copy">Codice: <strong>{{ error_code }}</strong></p>
    <p class="error-copy">{{ error_message }}</p>
    <div class="error-actions">
      {% if reconnect_url %}
      <a class="error-action primary" href="{{ reconnect_url }}">Ricollega Discord</a>
      {% endif %}
      {% if guild_id %}
      <a class="error-action" href="{{ url_for('dj_console_login', guild_id=guild_id) }}">Cambia account</a>
      {% endif %}
      <a class="error-action" href="{{ url_for('index') }}">Torna dashboard</a>
    </div>
  </main>
</body>
</html>
