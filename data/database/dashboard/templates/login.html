<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login – Pytonazz Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 110 110'><text y='1em' font-size='90'>💿</text></svg>">
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
<script src="{{ url_for('static', filename='js/snake.js') }}" defer></script>
</head>
<body class="login-page">
<main class="login-wrap">
  <section class="login-intro" aria-label="Pytonazz">
    <span class="eyebrow">PYTONAZZ / MUSIC & COMMUNITY</span>
    <h2>La tua musica.<br>Il tuo ecosistema.</h2>
    <p>Gestisci la libreria del tuo server in un unico spazio.</p>
    <div class="snake-stage" aria-label="Serpente 3D interattivo">
  <canvas aria-hidden="true"></canvas>
  <button type="button" class="snake-toggle" aria-pressed="false" aria-label="Pausa animazione">Ⅱ</button>
</div>
  </section>
  <div class="login-card">
    <div class="login-logo">PZ / LIBRERIA</div>
    <h1>Bentornato.</h1>
    <p class="login-sub">Accedi con le credenziali della dashboard per gestire la libreria del bot.</p>

    {% if error %}
    <div class="login-error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login" autocomplete="on">
      <div class="field">
        <label for="username">Utente</label>
        <input
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          placeholder="username"
          required
          autofocus
        >
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pwd-wrap">
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          >
          <button type="button" class="eye-btn" onclick="togglePwd()" aria-label="Mostra/nascondi password">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
              viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-login">Accedi</button>
    </form>
  </div>
</main>

<script>
function togglePwd() {
  const inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  document.querySelector('.eye-btn').setAttribute('aria-pressed', String(inp.type === 'text'));
}
</script>
</body>
</html>
